<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>W1 bench wiring: B200mini and E310 over cable, 60 dB each way</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">W1 bench: B200mini and E310 over coax, 60 dB each way</text>

  <!-- Radios -->
  <rect x="30" y="80" width="190" height="230" rx="10" fill="#eef3fb" stroke="#2b5797" stroke-width="2"/>
  <text x="125" y="108" text-anchor="middle" font-weight="bold" fill="#111">Ettus B200mini</text>
  <text x="125" y="128" text-anchor="middle" font-size="12" fill="#444">AD9364, TCXO</text>
  <rect x="660" y="80" width="190" height="230" rx="10" fill="#eef3fb" stroke="#2b5797" stroke-width="2"/>
  <text x="755" y="108" text-anchor="middle" font-weight="bold" fill="#111">Ettus USRP E310</text>
  <text x="755" y="128" text-anchor="middle" font-size="12" fill="#444">AD9361, TCXO</text>

  <!-- Ports -->
  <rect x="190" y="160" width="60" height="28" rx="4" fill="#fff" stroke="#2b5797"/>
  <text x="220" y="179" text-anchor="middle" font-size="12" fill="#111">TX/RX</text>
  <rect x="190" y="250" width="60" height="28" rx="4" fill="#fff" stroke="#2b5797"/>
  <text x="220" y="269" text-anchor="middle" font-size="12" fill="#111">RX2</text>
  <rect x="630" y="160" width="60" height="28" rx="4" fill="#fff" stroke="#2b5797"/>
  <text x="660" y="179" text-anchor="middle" font-size="12" fill="#111">RX2-B</text>
  <rect x="630" y="250" width="60" height="28" rx="4" fill="#fff" stroke="#2b5797"/>
  <text x="660" y="269" text-anchor="middle" font-size="12" fill="#111">TRX-A</text>
  <text x="755" y="215" text-anchor="middle" font-size="11" fill="#666">RX2-A, TRX-B: not connected</text>

  <!-- Forward path: B200 TX/RX to E310 RX2-B -->
  <line x1="250" y1="174" x2="300" y2="174" stroke="#333" stroke-width="2"/>
  <rect x="300" y="160" width="70" height="28" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="335" y="179" text-anchor="middle" font-size="13" fill="#111">30 dB</text>
  <line x1="370" y1="174" x2="400" y2="174" stroke="#333" stroke-width="2"/>
  <rect x="400" y="160" width="70" height="28" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="435" y="179" text-anchor="middle" font-size="13" fill="#111">20 dB</text>
  <line x1="470" y1="174" x2="500" y2="174" stroke="#333" stroke-width="2"/>
  <rect x="500" y="160" width="70" height="28" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="535" y="179" text-anchor="middle" font-size="13" fill="#111">10 dB</text>
  <line x1="570" y1="174" x2="628" y2="174" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="148" text-anchor="middle" font-size="13" fill="#111">B200 to E310: 30 + 20 + 10 = 60 dB</text>

  <!-- Reverse path: E310 TRX-A to B200 RX2 -->
  <line x1="630" y1="264" x2="570" y2="264" stroke="#333" stroke-width="2"/>
  <rect x="500" y="250" width="70" height="28" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="535" y="269" text-anchor="middle" font-size="13" fill="#111">30 dB</text>
  <line x1="500" y1="264" x2="470" y2="264" stroke="#333" stroke-width="2"/>
  <rect x="400" y="250" width="70" height="28" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="435" y="269" text-anchor="middle" font-size="13" fill="#111">20 dB</text>
  <line x1="400" y1="264" x2="370" y2="264" stroke="#333" stroke-width="2"/>
  <rect x="300" y="250" width="70" height="28" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="335" y="269" text-anchor="middle" font-size="13" fill="#111">10 dB</text>
  <line x1="300" y1="264" x2="252" y2="264" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="300" text-anchor="middle" font-size="13" fill="#111">E310 to B200: 30 + 20 + 10 = 60 dB</text>

  <!-- Host connections -->
  <rect x="330" y="345" width="220" height="44" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="440" y="372" text-anchor="middle" fill="#111">Lab host (job service)</text>
  <line x1="125" y1="310" x2="330" y2="367" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="190" y="352" font-size="12" fill="#444">USB 3</text>
  <line x1="700" y1="310" x2="550" y2="367" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="560" y="332" font-size="12" fill="#444">Ethernet (private lab network)</text>
  <line x1="800" y1="310" x2="800" y2="345" stroke="#b03030" stroke-width="2"/>
  <rect x="720" y="345" width="150" height="44" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="795" y="366" text-anchor="middle" font-size="13" fill="#111">Bench supply</text>
  <text x="795" y="382" text-anchor="middle" font-size="12" fill="#444">6 V DC to the E310</text>

  <!-- Notes -->
  <text x="30" y="420" font-size="12" fill="#333">Fixed 50 ohm SMA attenuators (DC to 6 GHz, 1 W or more). Every SMA join tightened by hand: a loose join on the B200 side once added about 21 dB.</text>
  <text x="30" y="438" font-size="12" fill="#333">No antenna on any port. Ettus limits: TX +20 dBm, RX input -15 dBm; at full TX gain a receiver here would see about -40 dBm.</text>
  <text x="30" y="456" font-size="12" fill="#333">Stack swap (2026-11-03): the two stacks are within about 2.5 dB of each other. W1 runs at 915 MHz, 1 MS/s, 250 kHz digital IF.</text>
</svg>
