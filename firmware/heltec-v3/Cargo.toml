[package]
name = "oasa-lora-modem-heltec-v3"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "OASA LoRa modem firmware for the Heltec WiFi LoRa 32 V3 (ESP32-S3 and SX1262)"
repository = "https://github.com/joinoasa/oasa-radio"
publish = false

# The firmware is its own workspace: its own target, toolchain and lock file.
[workspace]

[[bin]]
name = "oasa-lora-modem-heltec-v3"
path = "src/main.rs"

[dependencies]
oasa-modem-core = { version = "0.1.0", path = "../modem-core" }

# Versions follow the esp-generate template (esp-rs/esp-generate) for esp-hal 1.2.
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"

# No esp-radio (Wi-Fi, Bluetooth), no esp-alloc (no heap), no esp-println or
# esp-backtrace: UART0 carries the modem's frames, so nothing else may print.

[profile.dev]
# The default debug profile is too slow and too big for a microcontroller.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
overflow-checks = true
