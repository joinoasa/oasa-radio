[package]
name = "oasa-modem-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "OASA LoRa modem core: serial framing, control protocol, settings, queue and SX126x driver. no_std, tested on the host."
